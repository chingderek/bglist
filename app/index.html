<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15365B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>我的桌遊</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5c6b7a;--line:#dde3ea;--pri:#15365B;--pri2:#1F5C8B;--warn:#a11d1d;
--key-bg:#EEF2F7;--key-fg:#2F4F6F;--key-bar:#9FB4CC;--warn-bg:#FDECEC;--warn-bar:#E0A0A0;--tip-bg:#EAF3FF;--tip-fg:#14507A;--tip-bar:#9CC3E8;
--ex-bg:#EDF7ED;--ex-fg:#1E5B24;--ex-bar:#A6CFA8;--alt:#F4F7FA;--fs:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11161c;--card:#1a2129;--ink:#e3e8ee;--sub:#9aa8b6;--line:#2c3743;--pri:#9cc3e8;--pri2:#7fb0de;--warn:#ff8a80;
--key-bg:#1d2836;--key-fg:#c4d4e6;--key-bar:#4b6a8c;--warn-bg:#3a1f22;--warn-bar:#8c4a4a;--tip-bg:#182a3d;--tip-fg:#b9d8f5;--tip-bar:#3f6f9c;--ex-bg:#1a2e1c;--ex-fg:#bfe3c1;--ex-bar:#4c7a4f;--alt:#1f2731}}
:root[data-theme=dark]{--bg:#11161c;--card:#1a2129;--ink:#e3e8ee;--sub:#9aa8b6;--line:#2c3743;--pri:#9cc3e8;--pri2:#7fb0de;--warn:#ff8a80;
--key-bg:#1d2836;--key-fg:#c4d4e6;--key-bar:#4b6a8c;--warn-bg:#3a1f22;--warn-bar:#8c4a4a;--tip-bg:#182a3d;--tip-fg:#b9d8f5;--tip-bar:#3f6f9c;--ex-bg:#1a2e1c;--ex-fg:#bfe3c1;--ex-bar:#4c7a4f;--alt:#1f2731}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;gap:8px;align-items:center}
:root[data-theme=dark] header{background:#0c2238}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#0c2238}}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:rgba(255,255,255,.14);border:0;border-radius:10px;min-width:40px;height:40px;padding:0 10px;color:#fff;font-size:15px;cursor:pointer}
.hb:active{background:rgba(255,255,255,.3)}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.flabel{font-size:12px;color:var(--sub);margin:2px 2px 4px}
.lhead{position:sticky;top:var(--hh,60px);z-index:15;background:var(--bg);margin:-12px -12px 6px;padding:8px 12px 2px;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.lhead .search{margin-bottom:6px}.lhead .search input{height:36px;border-radius:10px;padding:0 12px}
.lhead .chips{margin-bottom:0;padding-bottom:4px;gap:6px}.lhead .chip{padding:4px 10px;font-size:13px}
.lhead .flabel{display:none}.lhead .fpanel .flabel{display:block;margin:4px 2px 2px}
.ftog{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0 6px;padding:5px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;text-align:left}
.ftog .fs{flex:1;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftog .fn{background:var(--pri2);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.ftog .ar{transition:transform .2s}.ftog.open .ar{transform:rotate(180deg)}
.fpanel{max-height:45vh;overflow-y:auto;padding-bottom:4px}
.fclr{border:0;background:none;color:var(--pri2);font-size:13px;padding:4px 2px 6px;cursor:pointer}
.count{font-size:13px;color:var(--sub);margin:4px 2px 10px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.gc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px;border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.gc:active{transform:scale(.99)}
.gc img{width:76px;height:96px;object-fit:contain;object-position:center;flex:none;align-self:center}.gc .ph{width:76px;height:96px;align-self:center;border-radius:10px;flex:none;background:var(--alt)}
.gc .t{font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.gc .m{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.gc .wt{margin-top:2px}.gc .pp{margin-top:0}.gc .pp b{color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:4px;background:var(--alt);color:var(--sub)}
.tag.k{background:var(--pri2);color:#fff}
.hero{display:flex;gap:14px;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
.hero img{width:120px;height:150px;object-fit:contain;object-position:center;flex:none;align-self:center}
.hero h2{margin:0 0 6px;font-size:20px;line-height:1.3}
.hero .m{font-size:14px;color:var(--sub);line-height:1.6}
.hero .pp{font-size:15px;margin:2px 0}.hero .pp b{color:var(--ink);font-weight:700}
.desc{font-size:14px;color:var(--sub);margin:10px 2px;line-height:1.6}
.dlist{display:grid;gap:10px;margin-top:14px}
.dg{font-size:13px;color:var(--sub);margin:12px 2px 0}
.db{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer;width:100%;text-align:left}
.db .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.db small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.ic.card{background:#b23b6e}.ic.teach{background:#2e7d4f}.ic.rules{background:#1F5C8B}.ic.aid{background:#b26a00}.ic.flow{background:#7a3e9d}
/* 文件 */
.doc{font-size:var(--fs);line-height:1.75}
.doc .meta{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.6}
.doc h1{font-size:1.35em;color:var(--pri);margin:1.6em 0 .6em;padding-top:.7em;border-top:3px solid var(--pri);line-height:1.35}
.doc h1:first-of-type{margin-top:.4em}
.doc h2{font-size:1.15em;color:var(--pri2);margin:1.4em 0 .5em;line-height:1.4}
.doc h3{font-size:1.02em;color:#2E6F4E;margin:1.2em 0 .4em}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .doc h3{color:#8fd3a8}}
:root[data-theme=dark] .doc h3{color:#8fd3a8}
.doc p{margin:.55em 0}
.doc b.w,.doc .w,.doc .w b{color:var(--warn)}
.doc code{font-size:.9em;background:var(--alt);padding:0 4px;border-radius:4px}
.doc .li{display:flex;gap:.5em;margin:.35em 0}
.doc .li .mk{flex:none;min-width:1.4em;color:var(--pri2);font-weight:700}
.doc .li.l1{margin-left:1.4em}.doc .li.l1 .mk{color:var(--sub)}
.doc .li.wl .mk{color:var(--warn)}
.doc .icorow{display:flex;gap:.7em;align-items:flex-start;margin:.7em 0}
.doc .icos{flex:none;display:flex;gap:.25em;padding-top:.15em}
.doc .icos img{height:2.6em;width:auto;background:#fff;border-radius:.4em}
.doc .icos.g4{display:grid;grid-template-columns:1fr 1fr;gap:.2em}.doc .icos.g4 img{height:1.5em}
.doc .icot{flex:1;min-width:0}.doc .icot>*:first-child{margin-top:0}.doc .icot>*:last-child{margin-bottom:0}
.doc figure{margin:1em 0;text-align:center}
.doc figure img{max-width:100%;height:auto;border-radius:8px;background:#fff}
.doc figcaption{font-size:.85em;color:var(--sub);text-align:left;margin-top:.4em;line-height:1.6}
.doc hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.box{border-radius:12px;padding:.7em .9em;margin:.9em 0;border-left:5px solid}
.box p{margin:.3em 0}
.box .bt{font-weight:700;margin-bottom:.2em}
.box .lab{font-weight:700;margin-right:.3em}
.box.key{background:var(--key-bg);color:var(--key-fg);border-color:var(--key-bar)}.box.key .lab::before{content:"【"}.box.key .lab::after{content:"】"}
.box.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bar)}
.box.tip{background:var(--tip-bg);color:var(--tip-fg);border-color:var(--tip-bar)}.box.tip .lab::before{content:"【"}.box.tip .lab::after{content:"】"}
.box.ex{background:var(--ex-bg);color:var(--ex-fg);border-color:var(--ex-bar)}.box.ex .lab::before{content:"【"}.box.ex .lab::after{content:"】"}
.box b.w{color:inherit}
.tw{margin:.9em 0}
.tw table{border-collapse:collapse;width:100%;font-size:.92em;line-height:1.55;background:var(--card)}
.tw th{background:#1F5C8B;color:#fff;text-align:left;padding:.45em .6em;font-weight:700}
.tw td{border:1px solid var(--line);padding:.45em .6em;vertical-align:top}
.tw tbody tr:nth-child(even) td{background:var(--alt)}
.tw.wide{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.tw.wide table{width:max-content;min-width:100%}
.tw.wide td,.tw.wide th{max-width:16em}
.tw.wide th:first-child,.tw.wide td:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
.tw.wide th:first-child{background:#1F5C8B}
.tw.wide tbody tr:nth-child(even) td:first-child{background:var(--alt)}
@media(max-width:640px){
 .tw.cards table,.tw.cards tbody,.tw.cards tr,.tw.cards td{display:block;width:100%}
 .tw.cards thead{display:none}
 .tw.cards tr{border:1px solid var(--line);border-radius:12px;margin:.6em 0;overflow:hidden;background:var(--card)}
 .tw.cards tbody tr:nth-child(even) td{background:transparent}
 .tw.cards td{border:0;padding:.3em .8em}
 .tw.cards td:first-child{background:var(--alt)!important;padding:.5em .8em;font-weight:700}
 .tw.cards td:not(:first-child)::before{content:attr(data-h);display:block;font-size:.75em;color:var(--sub);font-weight:400}
 .tw.cards td:empty{display:none}
}
.dochead{position:sticky;top:var(--hh,60px);z-index:15;background:var(--card);margin:-12px -12px 10px;padding:2px 12px 8px;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.dochead .tabs,.dochead .secs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dochead .tabs::-webkit-scrollbar,.dochead .secs::-webkit-scrollbar{display:none}
/* 上排：切換文件＝粗體分頁＋底線；下排：章節索引＝灰底小膠囊 */
.dochead .tabs{gap:2px;border-bottom:1px solid var(--line);margin:0 -12px;padding:0 12px}
.dochead .tabs .chip{font-weight:700;font-size:15px;background:transparent;border:0;border-radius:0;padding:8px 12px 7px;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.dochead .tabs .chip.on{color:var(--pri);border-bottom-color:var(--pri2);background:transparent}
.dochead .secs{margin-top:8px;gap:6px}
.dochead .secs .chip{font-size:13px;font-weight:400;padding:4px 11px;max-width:15em;overflow:hidden;text-overflow:ellipsis;background:var(--alt);border:1px solid transparent;color:var(--sub)}
.dochead .secs .chip.on{background:var(--tip-bg);color:var(--tip-fg);border-color:var(--tip-bar)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:30;display:flex;flex-direction:column;gap:10px}
.fab button{width:50px;height:50px;border-radius:50%;border:0;background:var(--pri2);color:#fff;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.drawer .sh{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(86vw,380px);background:var(--card);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 30px}
.drawer h3{margin:4px 0 10px;font-size:16px}
.drawer a{display:block;padding:9px 6px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.drawer a.l2{padding-left:20px;font-size:14px;color:var(--sub)}
.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.set h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px}
.btn.p{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.note{font-size:13px;color:var(--sub);line-height:1.6;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
.empty{text-align:center;color:var(--sub);padding:40px 0}
/* 規則書與中文規則整理檔 */
.files{display:grid;gap:8px;margin-top:10px}
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fold summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:12px}
.fold summary::-webkit-details-marker{display:none}
.fold summary small{font-weight:400;font-size:13px;color:var(--sub);margin-left:auto}
.fold summary .ar{transition:.2s;color:var(--sub);font-size:20px}.fold[open] summary .ar{transform:rotate(90deg)}
.fold .files{margin:0;padding:0 10px 10px}
.fi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;font-size:15px;line-height:1.4}
.fold .fi{background:var(--bg)}
.ft{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#b23b3b}
.ft.img{background:#3b7bb2}.ft.fd{background:#c99a2e;font-size:18px}
.fi .fn{flex:1;min-width:0;word-break:break-all}.fi small{display:block;color:var(--sub);font-size:12px}
.pvwrap{overflow-x:auto;margin:0 -12px;-webkit-overflow-scrolling:touch}
.pv{margin:0 auto;padding:0 6px}
.pv .pg{background:#fff;margin:0 auto 10px;box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative}
.pv .pg canvas,.pv img{display:block;width:100%;height:auto}
.pv .pg span{position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:13px}
.zoom{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:30;display:flex;gap:8px;align-items:center}
.zoom button{width:46px;height:46px;border-radius:50%;border:0;background:var(--pri2);color:#fff;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.zoom span{background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:4px 9px;font-size:13px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:14px auto;max-width:320px}.prog i{display:block;height:100%;background:var(--pri2);width:0;transition:width .2s}
.lock{max-width:360px;margin:60px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.lock h2{margin:0 0 6px;font-size:19px}
.lock input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font-size:17px;margin:14px 0 10px;text-align:center;letter-spacing:.08em}
.lock .btn{width:100%;height:46px}
.lock .err{color:var(--warn);font-size:14px;min-height:1.4em;margin-top:8px}
.doc figure img:not([src]){min-height:80px;background:var(--alt)}
</style>
</head>
<body>
<header><button class="hb" id="back" style="display:none" aria-label="返回">←</button><h1 id="ttl">我的桌遊</h1><button class="hb" id="hidebtn" style="display:none"></button><button class="hb" id="setbtn" aria-label="設定">⚙</button></header>
<main id="app"><div class="empty">載入中…</div></main>
<div class="fab" id="fab" style="display:none"><button id="tocbtn" aria-label="目錄">☰</button><button id="topbtn" aria-label="回到頂端">↑</button></div>
<div class="drawer" id="drawer"><div class="sh"></div><div class="pn" id="toc"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('bgapp-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bgapp-'+k,JSON.stringify(v))}catch(e){}}};
let LIST=null; const GCACHE={};
const state=Object.assign({q:'',p:'',type:[],lang:[],w:'',sort:'pub',rev:false,fopen:false,hide:false},LS.get('filters',{}));
/* 排序跟線上清單網頁一樣：預設依出版社作品數（多→少），同組維持試算表順序 */
const SORTS=[['pub','出版社作品數',['多→少','少→多']],['name','名稱',['A→Z','Z→A']],['rating','BGG 評分',['高→低','低→高']],['weight','重度',['重→輕','輕→重']],['time','遊玩時間',['長→短','短→長']]];
const maxTime=g=>+(g.tmax||g.tmin||0);let PUB_RANK=null;
function pubRank(){if(PUB_RANK)return PUB_RANK;const G=LIST.games,cnt=p=>G.filter(g=>g.pub===p).length;
 const pubs=[...new Set(G.map(g=>g.pub))].sort((a,b)=>(a==='其他')-(b==='其他')||cnt(b)-cnt(a)||(!/^[A-Za-z0-9]/.test(a))-(!/^[A-Za-z0-9]/.test(b))||a.localeCompare(b,'en',{sensitivity:'base'}));
 PUB_RANK={};pubs.forEach((p,i)=>PUB_RANK[p]=i);return PUB_RANK}
function sortList(list){const R=pubRank(),s=state.rev?-1:1;
 const main={pub:(a,b)=>R[a.pub]-R[b.pub],name:(a,b)=>a.name.localeCompare(b.name,'zh-Hant'),rating:(a,b)=>b.rating-a.rating,weight:(a,b)=>b.weight-a.weight,time:(a,b)=>maxTime(b)-maxTime(a)}[state.sort]||((a,b)=>0);
 const val={rating:g=>g.rating,weight:g=>g.weight,time:maxTime}[state.sort];
 return list.sort((a,b)=>(val?(!val(a))-(!val(b)):0)||s*main(a,b)||a.order-b.order)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function applyPrefs(){const fs=LS.get('fs',17);document.documentElement.style.setProperty('--fs',fs+'px');const th=LS.get('theme','');if(th)document.documentElement.dataset.theme=th;else delete document.documentElement.dataset.theme}
applyPrefs();
async function getJSON(u,fresh){const r=await fetch(u,fresh?{cache:'no-store'}:{});if(!r.ok)throw new Error(r.status);return r.json()}
/* 內容都加密存放（AES-GCM）；密碼只在第一次輸入，之後記住由密碼推出的金鑰 */
let KEY=null;
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function b64e(buf){let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))}
async function getBin(u,fresh){const r=await fetch(u,fresh?{cache:'no-store'}:{});if(!r.ok)throw new Error('http '+r.status);return dec(await r.arrayBuffer())}
async function getEnc(u,fresh){return JSON.parse(new TextDecoder().decode(await getBin(u,fresh)))}
async function useKey(raw){KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
async function tryPassword(pw){const kj=await getJSON('key.json?t='+Date.now(),true);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(kj.salt.match(/../g).map(h=>parseInt(h,16))),iterations:kj.iter,hash:'SHA-256'},base,256);
 await useKey(raw);try{const ok=new TextDecoder().decode(await dec(b64d(kj.check)));if(ok!=='bgapp-ok')throw 0}catch(e){KEY=null;return false}
 LS.set('k',b64e(raw));return true}

/* ---- 原文規則書／中文規則整理檔：加密分塊放在 GitHub books 分支，下載後解密，PDF 用 pdf.js 畫 ---- */
const RAW='https://raw.githubusercontent.com/chingderek/bglist/books/f/';
function mb(n){return n>=1048576?(n/1048576).toFixed(n>=1e8?0:1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function fiHtml(f,key){return `<button class="fi" data-f="${key}"><span class="ft ${f.t==='img'?'img':''}">${f.t==='img'?'圖':'PDF'}</span><span class="fn">${esc(f.n)}<small>${mb(f.s)}${f.c?'｜已轉成 PDF':''}</small></span></button>`}
function filesHtml(g){const B=g.books||[],Z=g.zh||[];if(!B.length&&!Z.length)return'';let h='';
 if(B.length)h+=`<details class="fold"><summary><span class="ft fd">📁</span>規則書<small>${B.length} 個檔案</small><span class="ar">›</span></summary><div class="files">`+B.map((f,i)=>fiHtml(f,'b'+i)).join('')+'</div></details>';
 return `<div class="files" style="margin-top:14px">${h}${Z.map((f,i)=>fiHtml(f,'z'+i)).join('')}</div>`}
let VIEW=null;
function closeViewer(){if(!VIEW)return;VIEW.dead=true;try{VIEW.io&&VIEW.io.disconnect()}catch(e){}try{VIEW.pdf&&VIEW.pdf.destroy()}catch(e){}if(VIEW.url)URL.revokeObjectURL(VIEW.url);VIEW=null;const z=$('#zoom');if(z)z.remove()}
let PDFJS=null;
function loadPdfJs(){if(PDFJS)return PDFJS;PDFJS=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
 s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(pdfjsLib)};s.onerror=()=>{PDFJS=null;no(new Error('pdf.js'))};document.head.appendChild(s)});return PDFJS}
async function fetchFile(f,onp){const parts=[];let got=0;
 for(let k=0;k<f.k;k++){const r=await fetch(RAW+f.id+'.'+k+'.bin');if(!r.ok)throw new Error('http '+r.status);
  let buf;if(r.body&&r.body.getReader){const rd=r.body.getReader(),cs=[];let n=0;for(;;){const {done,value}=await rd.read();if(done)break;cs.push(value);n+=value.length;onp(Math.min(1,(got+n)/(f.s+1)))}
   buf=new Uint8Array(n);let o=0;cs.forEach(c=>{buf.set(c,o);o+=c.length})}else buf=new Uint8Array(await r.arrayBuffer());
  got+=buf.length;parts.push(await dec(buf.buffer))}
 return parts}
async function renderFile(id,k,i){const g=LIST.games.find(x=>x.id===id);const f=g&&(k==='b'?g.books:g.zh)[i];if(!f){location.hash='#/g/'+encodeURIComponent(id);return}
 setHeader(f.n,true);$('#fab').style.display='none';
 $('#app').innerHTML=`<div class="empty">下載中…（${mb(f.s)}）<div class="prog"><i id="pbar"></i></div><div class="note">看過一次就會存在手機裡，之後不用再下載。</div></div>`;
 const V=VIEW={zoom:1};let parts;
 try{parts=await fetchFile(f,p=>{const b=$('#pbar');if(b&&!V.dead)b.style.width=(p*100).toFixed(1)+'%'})}catch(e){if(!V.dead)$('#app').innerHTML='<div class="empty">下載失敗（離線且還沒看過這個檔？）</div>';return}
 if(V.dead)return;
 const blob=new Blob(parts,{type:f.m});parts=null;
 $('#app').innerHTML='<div class="pvwrap"><div class="pv" id="pv"></div></div>';
 document.body.insertAdjacentHTML('beforeend','<div class="zoom" id="zoom"><button id="zo">−</button><span id="zl">100%</span><button id="zi">＋</button></div>');
 const ZL=[1,1.5,2,3];let zi=0;const pv=$('#pv');
 const setZ=d=>{zi=Math.max(0,Math.min(ZL.length-1,zi+d));V.zoom=ZL[zi];pv.style.width=(V.zoom*100)+'%';$('#zl').textContent=Math.round(V.zoom*100)+'%';if(V.redraw)V.redraw()};
 $('#zo').onclick=()=>setZ(-1);$('#zi').onclick=()=>setZ(1);
 if(f.t==='img'){V.url=URL.createObjectURL(blob);pv.innerHTML=`<img src="${V.url}" alt="">`;return}
 let lib;try{lib=await loadPdfJs()}catch(e){pv.innerHTML='<div class="empty">PDF 閱讀器載入失敗，請連上網路再試一次。</div>';return}
 const data=new Uint8Array(await blob.arrayBuffer());
 let pdf;try{pdf=await lib.getDocument({data}).promise}catch(e){pv.innerHTML='<div class="empty">這個 PDF 打不開</div>';return}
 if(V.dead){pdf.destroy();return}V.pdf=pdf;
 const p1=await pdf.getPage(1),vp1=p1.getViewport({scale:1});
 pv.innerHTML=Array.from({length:pdf.numPages},(_,j)=>`<div class="pg" data-p="${j+1}" style="aspect-ratio:${vp1.width}/${vp1.height}"><span>第 ${j+1} 頁</span></div>`).join('');
 const draw=async el=>{if(V.dead)return;const n=+el.dataset.p,w=el.clientWidth;if(el._w===w)return;el._w=w;
  const pg=await pdf.getPage(n);const v0=pg.getViewport({scale:1});el.style.aspectRatio=v0.width+'/'+v0.height;
  const sc=Math.min(4,w*Math.min(2.5,devicePixelRatio||1)/v0.width);const vp=pg.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  try{await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}catch(e){el._w=0;return}
  if(V.dead||el._w!==w)return;el.innerHTML='';el.appendChild(c)};
 const clear=el=>{if(el._w){el._w=0;el.innerHTML=`<span>第 ${el.dataset.p} 頁</span>`}};
 V.io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?draw(e.target):clear(e.target)),{rootMargin:'1500px 0px'});
 pv.querySelectorAll('.pg').forEach(el=>V.io.observe(el));
 V.redraw=()=>pv.querySelectorAll('.pg').forEach(el=>{if(el._w){el._w=-1;draw(el)}})}
function route(){if(!LIST||!KEY)return;const h=decodeURIComponent(location.hash||'');let m;curDocKey=null;closeViewer();$('#drawer').classList.remove('on');
 if(h==='#/set')return renderSet();
 if((m=h.match(/^#\/g\/([^/]+)\/f\/([bz])(\d+)$/)))return renderFile(m[1],m[2],+m[3]);
 if((m=h.match(/^#\/g\/([^/]+)\/(\d+)$/)))return renderDoc(m[1],+m[2]);
 if((m=h.match(/^#\/g\/([^/]+)$/)))return renderGame(m[1]);
 renderList();const y=LS.get('listY',0);if(y)setTimeout(()=>scrollTo(0,y),0)}
/* 清掉舊版本留下、已經用不到的文件快取（指紋跟目前清單對不上的） */
async function pruneCache(){try{if(!('caches'in window)||!LIST)return;const gh={};LIST.games.forEach(g=>gh[g.id]=g.gh);
 const c=await caches.open('bgapp-cache');for(const r of await c.keys()){const u=new URL(r.url);const m=u.pathname.match(/\/g\/([^/]+)\.bin$/);
  if(m&&u.searchParams.get('h')!==gh[decodeURIComponent(m[1])])await c.delete(r)}}catch(e){}}
async function start(){try{await loadList(false)}catch(e){
  if(e&&e.name==='OperationError'){try{localStorage.removeItem('bgapp-k')}catch(_){}KEY=null;return renderLock('密碼已經換過了，請輸入新密碼。')}
  $('#app').innerHTML='<div class="empty">讀不到清單，請連上網路後再開一次。</div>';return}
 if(!start.hooked){start.hooked=1;addEventListener('hashchange',route)}route();setTimeout(pruneCache,3000)}
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(!window.crypto||!crypto.subtle){$('#app').innerHTML='<div class="empty">這個瀏覽器不支援解密，請更新系統的 WebView／Chrome。</div>';return}
 const k=LS.get('k','');if(!k)return renderLock();try{await useKey(b64d(k))}catch(e){return renderLock()}start()})();
