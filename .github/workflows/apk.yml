# 打包「我的桌遊」Android App（WebView 外殼）。
# 只有改到 android/ 或手動執行時才會跑；內容更新不需要重新打包 APK。
name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk bgapp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bgapp
          path: bgapp.apk
      - name: Publish to release "apk"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 我的桌遊 App
          body: |
            用手機打開這一頁，點下面的 bgapp.apk 下載並安裝。
            （第一次安裝要允許瀏覽器「安裝不明來源的應用程式」。）
          files: bgapp.apk
          make_latest: true
