plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.chingderek.bgapp'
    compileSdk 34

    defaultConfig {
        applicationId 'tw.chingderek.bgapp'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        app {
            storeFile file('../bgapp.jks')
            storePassword 'bgapp-store'
            keyAlias 'bgapp'
            keyPassword 'bgapp-store'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
